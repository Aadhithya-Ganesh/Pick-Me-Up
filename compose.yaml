services:
  ride-service:
    build: ./RideService
    container_name: ride-service
    ports:
      - "5000:5000"
    volumes:
      - ./RideService:/app
    networks:
      - backend
    depends_on:
      - database
    env_file:
      - .env

  database:
    image: postgres:18-alpine
    container_name: db
    env_file:
      - .env
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - "80:80"
    networks:
      - backend

networks:
  backend:

volumes:
  postgres-data:
