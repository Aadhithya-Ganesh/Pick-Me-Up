services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: booking_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  ride-service:
    build: ./RideService
    container_name: ride-service
    ports:
      - "5000:5000"
    volumes:
      - ./RideService:/app
    networks:
      - backend
    depends_on:
      - database
    env_file:
      - .env

  database:
    image: postgres:18-alpine
    container_name: db
    env_file:
      - .env
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - "80:80"
    networks:
      - backend

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - backend

networks:
  backend:

volumes:
  postgres-data:
  rabbitmq_data:
